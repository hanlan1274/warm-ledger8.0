name: warm_ledger
description: 完全离线的个人资金与灵活计划账本。
publish_to: none
version: 0.3.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  flutter_local_notifications: ^19.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: LedgerSans
      fonts:
        - asset: assets/fonts/LedgerSans-400.ttf
          weight: 400
        - asset: assets/fonts/LedgerSans-600.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
